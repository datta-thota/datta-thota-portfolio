<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DATTA'S ARCHIVE</title>
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .welcome {
      font-family: 'Bebas Neue', sans-serif;
      color: #aaa;
      opacity: 0;
      font-size: clamp(1.5rem, 6vw, 3rem);
      letter-spacing: 4px;
      animation: fadeIn 2s ease forwards;
      animation-delay: 0.5s;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      color: #fff;
      opacity: 0;
      font-size: clamp(2rem, 10vw, 7rem);
      transform: scale(0.5);
      animation: logoZoom 4.5s ease-in-out forwards;
      animation-delay: 1.5s; /* logo comes after welcome */
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      opacity: 0;
      animation: overlayFade 1.2s ease forwards;
      animation-delay: 4.5s; /* fade to black just before cut */
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes logoZoom {
      0%   { opacity: 0; transform: scale(0.5); }
      20%  { opacity: 1; transform: scale(1.2); }
      70%  { opacity: 1; transform: scale(1.5); }
      100% { opacity: 0; transform: scale(1.6); }
    }

    @keyframes overlayFade {
      0%   { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="welcome">A FILM BY </div>
  <div class="logo">DATTA THOTA</div>
  <div class="overlay"></div>

  <script>
    setTimeout(() => {
      window.location.href = "index2.html"; // go to portfolio
    }, 5500); // extra time for welcome + logo
  </script>
</body>
</html>
